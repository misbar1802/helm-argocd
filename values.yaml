# ── Nginx ──────────────────────────────────────────────
nginx:
  replicas: 1
  image: nginx:latest
  port: 80
  serviceType: NodePort

# ── Redis ──────────────────────────────────────────────
redis:
  replicas: 1
  image: redis:7-alpine
  port: 6379

# ── PostgreSQL ─────────────────────────────────────────
postgres:
  image: postgres:15-alpine
  port: 5432
  database: mydb
  user: admin
  password: secret123
  storage: 1Gi

# ── Prometheus ─────────────────────────────────────────
prometheus:
  image: prom/prometheus:latest
  port: 9090
  retention: 7d
  serviceType: NodePort
  scrapeInterval: 15s

# ── Grafana ────────────────────────────────────────────
grafana:
  image: grafana/grafana:10.2.0
  port: 3000
  adminPassword: admin123
  serviceType: NodePort

# ── Node Exporter ──────────────────────────────────────
nodeExporter:
  image: prom/node-exporter:latest
  port: 9100

# ── kube-state-metrics ─────────────────────────────────
kubeStateMetrics:
  image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.10.0
  port: 8080
